<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Avatar MVP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="avatar-panel">
        <div id="avatar" class="avatar emotion-neutral">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div id="mouth" class="mouth closed"></div>
        </div>
        <div id="status" class="status">待機中</div>
      </section>

      <section class="chat-panel">
        <h1>ChatGPT Avatar MVP</h1>
        <p class="meta" id="configText"></p>
        <div id="log" class="log" aria-live="polite"></div>
        <div class="controls">
          <input id="textInput" type="text" placeholder="話しかけてください" />
          <button id="sendBtn">送信</button>
          <button id="micBtn">🎙️ マイク</button>
          <button id="stopBtn">⏹ 停止</button>
        </div>
        <p class="help">音声未対応ブラウザではテキストのみで動作します。</p>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
